<!-- To insert student data -->
<!DOCTYPE html>
<html>
<head>
    <title>Insert Student</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>INSERT STUDENT</h1>
<hr>

<a href="index.html">Home</a> |
<a href="list.html">List Students</a> |
<a href="listOne.html">List Required Student</a> |
<a href="insert.html">Insert Student</a> |
<a href="update.html">Update Student</a> |
<a href="delete.html">Delete Student</a>

<hr>

Student Number
<input type="number" id="sno">
<br><br>

Student Name
<input type="text" id="name">
<br><br>

Class
<input type="number" id="class">
<br><br>

Total Marks
<input type="number" id="total">
<br><br>

<button onclick="saveStudent()">Save</button>

<br><br>

<button onclick="location.href='index.html'">Home Page</button>

<script>

function saveStudent()
{
    let sno = document.getElementById("sno").value;
    let name = document.getElementById("name").value;
    let studentClass = document.getElementById("class").value;
    let total = document.getElementById("total").value;

    if (!sno || !name || !studentClass || !total) {
        alert("Please fill all fields");
        return;
    }

    fetch("/students", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            sno: sno,
            name: name,
            studentClass: studentClass,
            total: total
        })
    })

    .then(response => {
        if (!response.ok) {
            return response.text().then(message => {
                throw new Error(message);
            });
        }
        return response.text();
    })

    .then(message => {
        alert(message);
        location.href = "index.html";
    })

    .catch(error => {
        alert("Error: " + error.message);
        console.error(error);
    });

}

</script>

</body>
</html>
